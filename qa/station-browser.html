<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>雪境小站 · 开发验证</title><style>body{margin:0;display:flex;gap:15px;background:#29434e;color:#fff;padding:12px;font:13px system-ui}aside{width:250px}button,select{display:block;width:100%;min-height:48px;margin:12px 0;padding:8px}iframe{border:0;flex:none;background:#edf3eb}pre{white-space:pre-wrap}</style><aside><h2>小站开发验证</h2><p>只用于检查手机布局、真实滑雪结算与收藏衔接。快进属于程序策略。</p><select id="size"><option>390×844</option><option>360×800</option><option>412×915</option></select><button id="gameCheck">快测当前雪路并结算</button><button id="partial">滑行 25 秒</button><button id="continueRun">继续当前雪路到结算</button><p>先在右侧小站点击「出发去灯塔」，等游戏加载后再快测。</p><pre id="result"></pre></aside><iframe id="app" width="390" height="844" src="../?audit"></iframe><script type="module">
import {drive} from './v9-sim.mjs';
import {readState} from '../station/state.js';
const frame=document.getElementById('app'),result=document.getElementById('result');document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split('×');frame.width=w;frame.height=h;};document.getElementById('gameCheck').onclick=()=>{const game=frame.contentWindow.document.getElementById('journeyFrame'),a=game.contentWindow.snowAudit;if(!a){result.textContent='先打开右侧的灯塔之旅。';return;}a.reset(9,'challenge');a.driver=g=>drive(g,'safe');a.start();a.advance(200);result.textContent='已使用正式物理快进结算。';};document.getElementById('partial').onclick=()=>{const a=frame.contentWindow.document.getElementById('journeyFrame').contentWindow.snowAudit;if(!a)return;a.reset(9,'challenge');a.driver=g=>drive(g,'safe');a.start();a.advance(25);};document.getElementById('continueRun').onclick=()=>{const a=frame.contentWindow.document.getElementById('journeyFrame').contentWindow.snowAudit;if(!a)return;a.resume();a.advance(200);};setInterval(()=>{const s=readState(localStorage);result.textContent=JSON.stringify({cards:s.cards.length,runs:s.runs.length,lastRun:s.runs.at(-1)},null,2);},500);
</script></html>
