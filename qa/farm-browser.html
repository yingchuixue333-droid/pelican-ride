<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>风里农场 V2 · 开发验收</title><style>body{font:13px system-ui;margin:12px;background:#dce4d3}button{min-height:44px;margin:4px;padding:7px}iframe{display:block;width:390px;height:844px;border:1px solid #778b6c;background:#eee}output{display:block;padding:8px;max-width:950px}</style><p>开发验收：可控时钟、真实规则。快进不等于真人等待。</p><button onclick="size(360,800)">360 × 800</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(412,915)">412 × 915</button><button onclick="run('advance',120)">快进2分钟</button><button onclick="run('advance',28800)">快进8小时</button><button onclick="run('grow',4)">四轮合法种收</button><button onclick="run('grow',40)">四十轮合法种收</button><button onclick="run('expand')">开垦新田</button><button onclick="check()">检查布局</button><button onclick="f.contentWindow.scrollTo(0,0)">回到田园</button><output id="result">等待加载</output><iframe id="game" src="../?audit"></iframe><script>
const f=document.querySelector('iframe');let audit;f.onload=()=>{audit=f.contentWindow.farmAudit;check()};function size(w,h){f.style.width=w+'px';f.style.height=h+'px'}
async function run(method,arg){for(const b of document.querySelectorAll('body>button'))b.disabled=true;try{await audit[method](arg);check()}catch(e){document.querySelector('output').textContent=e.message}finally{for(const b of document.querySelectorAll('body>button'))b.disabled=false}}
function check(){let d=f.contentDocument,win=f.contentWindow,rects=[...d.querySelectorAll('.plot')].map(b=>b.getBoundingClientRect()),s=audit.state;document.querySelector('output').textContent=JSON.stringify({version:s.version,nativePan:d.defaultView.getComputedStyle(d.getElementById('plots')).touchAction,width:win.innerWidth,horizontalOverflow:d.documentElement.scrollWidth>win.innerWidth,minPlotHeight:Math.round(Math.min(...rects.map(r=>r.height))),plots:s.plotCount,xp:s.xp,coins:s.coins,crops:s.plots.filter(Boolean).map(p=>p.id),soil:s.soil});}
</script></html>
