<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>果园手机视口验收</title><style>body{margin:12px;background:#dde5d9;font:14px system-ui}button{padding:10px;margin:3px;min-height:44px}iframe{display:block;width:390px;height:844px;border:1px solid #809173}output{display:block;max-width:700px;margin:10px 0}</style><nav><button onclick="size(360,800)">360</button><button onclick="size(390,844)">390</button><button onclick="size(412,915)">412</button><button onclick="load('before')">本地改前</button><button onclick="load('before48')">改前盛果</button><button onclick="load('live')">线上V3.0</button><button onclick="load('after')">新版试玩</button><button onclick="load('fallback')">无插画回退</button><button onclick="audit()">检查布局</button></nav><output id="result">浏览器手机宽度仿真，不是安卓实机。</output><iframe id="phone" title="农场手机视口" src="orchard-before/"></iframe><script>const f=document.querySelector('iframe');function size(w,h){f.style.width=w+'px';f.style.height=h+'px'}function load(which){f.src=which==='before48'?'orchard-before/?fixture=48':which==='fallback'?'../?orchardPreview&noFarmArt':which==='before'?'orchard-before/':which==='live'?'https://yingchuixue333-droid.github.io/pelican-ride/':'../?orchardPreview'}function audit(){try{let d=f.contentDocument;document.querySelector('output').textContent=JSON.stringify({width:f.clientWidth,overflow:d.documentElement.scrollWidth>f.clientWidth,fruitTargets:[...d.querySelectorAll('.fruit-touch')].filter(e=>e.getBoundingClientRect().width).map(e=>({w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)})),canvas:[...d.querySelectorAll('canvas')].map(e=>({w:e.width,h:e.height})),status:d.querySelector('#orchardNote')?.textContent})}catch{document.querySelector('output').textContent='线上跨域页面：请直接检查截图。'}}f.onload=()=>{};</script></html>
