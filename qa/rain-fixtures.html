<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>雨后果园 · 独立测试档</title><style>body{font:14px system-ui;background:#dce6d5;margin:8px}button{min-height:44px;margin:3px;padding:8px}iframe{width:390px;height:844px;display:block;border:1px solid #879b7d}</style><button data-kind="young">幼苗与空果位</button><button data-kind="demo">重置示范档</button><button data-kind="old">旧V3备份</button><button data-kind="poor">余额不足档</button><button data-kind="stages">星蜜瓜四阶段</button><button data-w="360">360</button><button data-w="390">390</button><button data-w="412">412</button><p>只写风里农场雨后试玩独立测试键，不读取正式键。</p><iframe id="phone" title="测试农场" src="../?orchardPreview"></iframe><script type="module">import{newGame,plant}from'../farm/model.js?v=20261121e';import{makeRainDemo}from'../farm/rain-demo.js?v=20261121e';const key='windfarm-rain-preview-v1',f=document.querySelector('iframe');for(const b of document.querySelectorAll('[data-kind]'))b.onclick=()=>{let n=Date.now(),s=b.dataset.kind==='young'||b.dataset.kind==='old'?newGame(n):makeRainDemo(n);if(b.dataset.kind==='old'){s.coins=1234;s.orchard.trees[0].born=n-24*3600000;delete s.orchard.basketCount;delete s.orchard.basketRecent;}if(b.dataset.kind==='poor'){s.coins=20;s.rainPreviewStipend=true;s.plots.fill(null);}if(b.dataset.kind==='stages'){s.rainPreviewStipend=true;s.plots.fill(null);for(const [i,progress] of [0,.28,.52,.8,1,0].entries()){if(i===5)break;plant(s,i,'starwumpkin',n);const p=s.plots[i];p.start-=p.duration*progress;p.end-=p.duration*progress;}}localStorage.setItem(key,JSON.stringify(s));f.src='../?orchardPreview';};for(const b of document.querySelectorAll('[data-w]'))b.onclick=()=>{f.style.width=b.dataset.w+'px';f.style.height=({360:800,390:844,412:915})[b.dataset.w]+'px';};</script></html>
