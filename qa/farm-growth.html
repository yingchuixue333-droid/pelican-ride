<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>作物生长与再生 · 开发验收</title><style>body{background:#f1e5bf;color:#355436;font:14px system-ui;margin:22px}h1{font-size:22px}label{margin-right:12px}select,button{min-height:44px;font:inherit;padding:6px 12px}main{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;max-width:1250px;margin-top:16px}article{background:#d7b77c;border-radius:14px;overflow:hidden;text-align:center}canvas{display:block;width:100%;aspect-ratio:1}small{display:block;margin:0 0 10px}p{font-size:12px}</style><h1>作物生长与再生 · 开发验收</h1><p>只读素材预览，不写入玩家存档。第一行从幼苗到成熟；第二行显示同一植株采后重新结果。</p><label>作物 <select id="crop" aria-label="预览作物"></select></label><label>土壤 <select id="soil" aria-label="预览土壤"><option value="0">普通</option><option value="1">肥沃</option><option value="2">丰饶</option></select></label><main></main><script type="module">
import{CROPS}from'../farm/catalog.js';import{drawPlant,assetsReady,SOIL_ART}from'../farm/art.js?v=20261114c';import{visualPhase}from'../farm/presentation.js?v=20261114c';import{newGame,plant,threshold}from'../farm/model.js';
for(let c of CROPS){let o=document.createElement('option');o.value=c.id;o.textContent=c.name;document.querySelector('select').append(o);}await assetsReady;
function draw(){document.querySelector('main').replaceChildren();let id=document.querySelector('#crop').value,meta=CROPS.find(c=>c.id===id),soil=Number(document.querySelector('#soil').value);for(let cycle of [1,2])for(let g of [0,.22,.48,.69,.9,1]){let s=newGame(1800000000000);s.xp=threshold(40);s.coins=10000;plant(s,4,id,s.at);let p=s.plots[4];p.cycle=cycle;let v=visualPhase(s,p,p.start+p.duration*g),a=document.createElement('article'),canvas=document.createElement('canvas'),title=document.createElement('small');canvas.width=440;canvas.height=440;let c=canvas.getContext('2d');c.setTransform(2,0,0,2,220,360);c.fillStyle=SOIL_ART[soil].soil;c.beginPath();c.roundRect(-100,-40,200,100,18);c.fill();drawPlant(c,id,0,0,v,0,soil,false);title.textContent=(cycle===1?'初种':'采后')+' '+Math.round(g*100)+'% · '+v.label;if(cycle===2&&meta.harvests===1)title.textContent='单茬作物，无续果（姿态测试）';a.append(canvas,title);document.querySelector('main').append(a);}}
document.querySelector('#crop').onchange=draw;document.querySelector('#soil').onchange=draw;draw();
</script></html>
