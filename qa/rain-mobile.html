<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>雨后果园 · 浏览器验收</title><style>body{margin:8px;background:#d8e2d4;font:14px system-ui}button{margin:3px;padding:10px;min-height:44px}iframe{display:block;width:390px;height:844px;border:1px solid #879b7d}output{display:block;max-width:1000px;padding:6px}</style><nav><button onclick="size(360,800)">360</button><button onclick="size(390,844)">390</button><button onclick="size(412,915)">412</button><button onclick="load('new')">雨后试玩</button><button onclick="load('old')">上次试玩</button><button onclick="audit()">检查布局</button></nav><output id="result">手机宽度浏览器仿真，不是安卓实机。</output><iframe id="phone" title="手机试玩" src="../?orchardPreview"></iframe><script>const f=document.querySelector('iframe');function size(w,h){f.style.width=w+'px';f.style.height=h+'px'}if(new URLSearchParams(location.search).get('film')==='360')size(360,800);function load(which){f.src=which==='old'?'../orchard-preview/':'../?orchardPreview'}function audit(){let d=f.contentDocument;document.querySelector('output').textContent=JSON.stringify({width:f.clientWidth,overflow:d.documentElement.scrollWidth>f.clientWidth,stored:d.querySelector('#orchardPage')?.dataset.stored,basket:d.querySelector('#basketText')?.textContent,art:d.querySelector('#orchardCanvas')?.dataset.assets,first:[...d.querySelectorAll('.fruit-touch')].map(b=>{let r=b.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}),errors:[...d.querySelectorAll('pre')].map(e=>e.textContent)});}</script></html>
