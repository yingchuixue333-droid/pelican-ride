<!doctype html><meta charset="utf-8"><title>弹射开发验收台</title><style>body{margin:12px;background:#d7dfdb;font:14px system-ui}button{padding:10px;margin:4px}iframe{display:block;border:1px solid #687c79;width:390px;height:844px}</style>
<p>开发验收台：固定合法输入 + 物理快进，不代表真人试玩。</p>
<button onclick="size(360,800)">360 × 800</button><button onclick="size(390,844)">390 × 844</button><button onclick="size(412,915)">412 × 915</button>
<button onclick="win()">当前场合法通关</button><button onclick="fail()">三弹耗尽</button><button onclick="audit.advance(7)">推进 7 秒</button><output id="result"></output>
<iframe id="game" src="../fling.html?audit"></iframe><script>
const game=document.querySelector('iframe');let audit;game.onload=()=>audit=game.contentWindow.flingAudit;function size(w,h){game.style.width=w+'px';game.style.height=h+'px'}
function win(){let i=audit.game.index;audit.reset(i);let routes=[[[89.917,86.832]],[[44.807,137.903]],[[47.898,147.414],[-103.715,115.187]]];for(const p of routes[i]){audit.launch(...p);audit.advance(6)}document.querySelector('output').textContent=audit.game.phase+' / '+audit.game.hits+' 铃'}
function fail(){audit.reset();for(let i=0;i<3;i++){audit.launch(0,-50);audit.advance(6)}document.querySelector('output').textContent=audit.game.phase}
</script>
