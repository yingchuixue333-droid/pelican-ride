<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风里农场 · 果园改前改后</title><style>*{box-sizing:border-box}body{margin:auto;padding:24px 16px;max-width:1000px;font:16px/1.8 system-ui;background:#edf1e4;color:#34513c}a{color:#36684c}h1{font-size:25px}h2{font-size:20px}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}figure{margin:0}img{display:block;width:100%;max-width:390px;border-radius:14px;border:1px solid #c4d1ba}figcaption{padding:7px 0;font-size:14px}.try{display:inline-block;padding:10px 24px;border-radius:24px;background:#3a6349;color:white;text-decoration:none}small{color:#64775c}@media(max-width:480px){body{padding:18px 10px}section{gap:7px}figcaption{font-size:12px}}</style><h1>这次，先看见自己的树。</h1><p>只供对比的果园试玩，正式首页仍为 V3.0。测试档与正式农场隔离。</p><a class="try" href="./">进入果园试玩</a><p>默认幼苗；点顶部“看盛果测试”，立即试三棵有果的树。点树近看，点枝上的果实摘一份。页面底部还可快进至0／6／24／48小时。测试按钮会重置这份测试档。</p><h2>同为48小时，390 × 844 CSS像素</h2><section><figure><img src="evidence/before-mature.jpg"><figcaption>改前：管理弹窗占据画面</figcaption></figure><figure><img src="evidence/after-mature.jpg"><figcaption>改后：枝上的果实就是可摘库存</figcaption></figure></section><h2>幼苗首屏与近看</h2><section><figure><img src="evidence/after-seedling.jpg"><figcaption>零小时幼苗，场景优先</figcaption></figure><figure><img src="evidence/after-close.jpg"><figcaption>近看苹果，一次摘一份</figcaption></figure></section><h2>菜地仍在，一触即达</h2><section><figure><img src="evidence/before-field.jpg"><figcaption>原版菜地首屏</figcaption></figure><figure><img src="evidence/after-field.jpg"><figcaption>新版菜地，保留种收浇和倒计时</figcaption></figure></section><p><small>以上为真实浏览器的手机宽度截图，不是安卓实机。已做360／390／412宽度检查与规则回归；未做安卓硬件、真实触屏手感、长期耗电或真等待48小时验证。没有使用王者素材、角色或经济设计。</small></p></html>
