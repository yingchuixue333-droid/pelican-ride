<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V6.1 学会冲雪 · 实际玩法验收</title><style>body{margin:0;background:#e5eeec;font:14px system-ui;display:flex;gap:18px}iframe{border:0;width:390px;height:844px;flex-shrink:0}aside{padding:14px;max-width:560px}button{min-height:42px;margin:3px;padding:5px 10px}pre{white-space:pre-wrap;font:12px monospace}h2{font-size:20px}</style><iframe id="game" title="实际游戏" src="./index.html?audit=1&build=20261004-v61e"></iframe><aside><h2>正式玩法同源验收</h2><p>策略仅发送单指按下/松开；无定位、无状态注入。</p><button id="s360">360×800</button><button id="s390">390×844</button><button id="s430">430×932</button><button id="lesson">练习普通跳</button><button id="lessonTurn">练习一圈真实输入</button><button id="lessonUnder">练习少转</button><button id="lessonOver">练习多转</button><button id="long">持续资源观察</button><button id="audioRecord">录制30秒实际音频</button><a id="audioFile" hidden download="V61-实际声音.webm">下载实际声音</a><button id="idle">无输入观察</button><button id="normal">不做技巧的低路策略</button><button id="high">地形决策策略</button><button id="recovery">三次轻碰后正常策略</button><button id="continueHigh">继续地形观察</button><button id="stop">停止策略</button><button id="tap20">20ms轻点</button><button id="tap40">40ms轻点</button><button id="tap80">80ms轻点</button><button id="tap150">150ms轻点</button><button id="pointer">双指取消检查</button><button id="restart">十次重开</button><button id="pause">暂停</button><button id="resume">恢复</button><pre id="log">等待加载</pre></aside><script type="module">
import {viewMetrics} from './journey/config.js?v=20261004-v61e';
import {planInput} from './journey/validation.js?v=20261004-v61e';
const frame=document.getElementById('game'),log=document.getElementById('log');let bot=null,notes=[],lastTap=0,lastLog=0;const q=()=>frame.contentWindow.snowAudit,on=(id,fn)=>document.getElementById(id).onclick=fn;
for(let[w,h]of[[360,800],[390,844],[430,932]])on('s'+w,()=>{frame.style.width=w+'px';frame.style.height=h+'px';});
on('lesson',()=>{q().reset(1,'practice');q().start(1,'practice');bot='lesson';notes=[];});on('lessonTurn',()=>{q().reset(1,'practice');q().start(1,'practice');bot='lessonTurn';notes=[];});for(let key of ['lessonUnder','lessonOver'])on(key,()=>{q().reset(1,'practice');q().start(1,'practice');bot=key;notes=[];});on('long',()=>{q().reset(1,'challenge',{skipTutorial:false});q().start();bot='long';notes=[];});on('audioRecord',()=>{let a=q();a.audio.unlock();let recorder=new MediaRecorder(a.audio.capture.stream),chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let link=document.getElementById('audioFile');link.href=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));link.hidden=false;};recorder.start();setTimeout(()=>recorder.stop(),30000);});on('idle',()=>{q().reset(1,'challenge',{skipTutorial:false});q().start();bot=null;notes=[];});for(let k of ['normal','high','recovery'])on(k,()=>{q().reset(1,'challenge',{skipTutorial:false});q().start();bot=k;notes=[];});on('continueHigh',()=>{bot='high';if(q().game.state==='paused')q().resume();});on('stop',()=>{bot=null;q().input('jump',false);});on('pause',()=>q().pause());on('resume',()=>q().resume());
for(let ms of [20,40,80,150])on('tap'+ms,()=>{let a=q();a.reset(1);a.start();bot=null;let c=frame.contentDocument.getElementById('canvas');c.dispatchEvent(new PointerEvent('pointerdown',{pointerId:91,isPrimary:true,bubbles:true,clientX:200,clientY:440}));setTimeout(()=>c.dispatchEvent(new PointerEvent('pointerup',{pointerId:91,isPrimary:true,bubbles:true})),ms);notes.push('真实页面事件20/40/80/150ms测试（浏览器合成pointer事件） '+ms);});
on('pointer',()=>{let a=q();bot=null;a.reset(1);a.start();let c=frame.contentDocument.getElementById('canvas');for(let id of [71,72])c.dispatchEvent(new PointerEvent('pointerdown',{pointerId:id,isPrimary:id===71,bubbles:true}));c.dispatchEvent(new PointerEvent('pointercancel',{pointerId:71,bubbles:true}));c.dispatchEvent(new PointerEvent('pointerup',{pointerId:72,bubbles:true}));notes.push('双指down → 主指cancel → 次指up');});on('restart',()=>{bot=null;for(let i=0;i<10;i++){q().reset(1);q().start();q().pause();}notes.push('10次重开完成');});
function loop(){let a=q();if(a){let g=a.game;if(bot==='long'&&g.state!=='playing'&&g.state!=='paused'){notes.push({ended:g.time,reason:g.reason,parts:{...g.p.parts},routes:g.stats.routeCount,lines:g.stats.lineSeconds});a.reset(1,'challenge',{skipTutorial:false});a.start();g=a.game;}if(bot&&g.state==='paused')a.resume();a.driver=h=>{let g=h;if(bot&&g.state==='playing'&&bot.startsWith('lesson')){let p=g.p,s=g.level.segments.find(s=>p.x>=s.start&&p.x<s.end);if(p.grounded&&s.ramp&&Math.abs(p.x-s.start-s.ramp+30)<22&&!g.stats.jumps){a.input('jump',true);if(bot==='lesson')a.input('jump',false);}if(bot!=='lesson'&&g.input.jump&&Math.abs(p.rotation)>=(bot==='lessonUnder'?4.9:bot==='lessonOver'?7.8:Math.PI*2+.03))a.input('jump',false);}else if(bot&&g.state==='playing'){let skip=bot==='recovery'&&g.p.collisions<3&&g.time<60&&g.level.segments.find(s=>g.p.x>=s.start&&g.p.x<s.end)?.obstacles.some(o=>o.kind==='rock'&&!g.hit.has(o.id)&&o.x>g.p.x&&o.x-g.p.x<1000);if(skip){a.input('jump',false);}else planInput(g,{routes:bot!=='normal',tricks:bot!=='normal'});}};if(performance.now()-lastLog<250){requestAnimationFrame(loop);return;}lastLog=performance.now();let sorted=a.frames.slice(-2400).filter(x=>x>0).sort((a,b)=>a-b);log.textContent=JSON.stringify({version:a.version,seed:g.level.seed,condition:g.level.options.condition,templates:g.level.templateIds,startupMs:a.startupMs,sessionActive:a.session.active,bot,state:g.state,time:+g.time.toFixed(2),x:Math.round(g.p.x),chapter:g.level.segments.find(s=>g.p.x>=s.start&&g.p.x<s.end)?.theme,reason:g.reason,input:g.input,pointers:a.activePointers,jumps:g.stats.jumps,flaps:g.stats.flaps,grounded:g.p.grounded,rotation:+g.p.rotation.toFixed(3),feathers:g.p.rescue,fish:g.p.fish,collisions:g.p.collisions,hits:g.stats.hits,flips:g.p.flips,partners:g.stats.partners,mount:g.p.mount,wind:+g.p.wing.toFixed(2),rewards:g.rewards.size,completedRoutes:g.stats.routeCount,routeIds:[...g.routes],lesson:g.lesson,diagnosis:g.lastJump,coaching:frame.contentDocument.getElementById('coach').textContent,toast:frame.contentDocument.getElementById('toast').textContent,touches:[...g.platformTouches],flight:g.flightId,parts:g.p.parts,recent:g.history.filter(e=>['land','relay','hit','recover','route','routeEnter','routeLost','lineComplete','pressure','diagnosis'].includes(e.type)).slice(-12),score:g.p.score,line:g.line,completeLines:g.completedLines.size,completeLineTotal:g.stats.lineSeconds,historyCount:g.history.length,boostSeconds:g.stats.boostSeconds,pressure:g.pressureState,pressureRecoveries:g.stats.pressureRecoveries,lead:Math.round(g.p.lead),worldSpeed:+g.p.speed.toFixed(1),screenWidthRate:+(g.p.speed/viewMetrics(g.p.speed).worldWidth).toFixed(3),p50:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)],dropped:a.dropped,objects:{items:g.level.items.length,segments:g.level.segments.length,events:g.events.length,buttons:frame.contentDocument.querySelectorAll('button').length},audioNodes:a.audioNodes,audioState:a.audio.context?.state,progress:a.progress,notes},null,2);}requestAnimationFrame(loop);}loop();
</script></html>
