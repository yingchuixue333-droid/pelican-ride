<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>雪路新章 · 开发验收（非正式玩法）</title><style>body{margin:0;background:#dbe6e9;font:14px system-ui;color:#234653}iframe{border:0;position:absolute;left:0;top:0;width:390px;height:844px}aside{position:absolute;left:565px;top:18px;width:480px}button,select{font:inherit;padding:10px;margin:3px;min-height:48px;border:1px solid #acc5cc;border-radius:8px;background:#f2f7f1}pre{white-space:pre-wrap;font-size:12px}h2{font-size:18px}</style><iframe id="game" src="./redesign-preview.html?audit=1" title="真实游戏渲染"></iframe><aside><h2>开发验收 · 同源游戏 / 有定位和策略控制</h2><p>录制或定位内容须标明自动策略及开发定位。</p><button id="size360">360×800</button><button id="size390">390×844</button><button id="size412">412×915</button><br><button id="first">首屏</button><button id="play">连续正常策略</button><button id="manual">停止策略</button><button id="pause">暂停</button><button id="resume">恢复</button><button id="restart10">十次重开</button><button id="pointer">双指与cancel测试</button><br><button id="valley">雪谷定位</button><button id="forest">林海定位</button><button id="cloud">云路定位</button><button id="ridge">山脊定位</button><button id="mount">骑乘定位</button><button id="boost">冲刺定位</button><button id="avalanche">雪崩定位</button><button id="ending">结算定位</button><button id="low">低跳</button><button id="high">高跳</button><button id="flip">特技起停</button><pre id="log">等待游戏加载</pre></aside><script type="module">
import {planInput} from './game/validation.js?v=20261003-r8';import {ground} from './game/levels.js?v=20261003-r8';import {boost,takeMount} from './game/physics.js?v=20261003-r8';
const frame=document.getElementById('game'),log=document.getElementById('log');let bot=false,miss=true,mode='首屏',notes=[];const qa=()=>frame.contentWindow.snowAudit;const on=(id,fn)=>document.getElementById(id).onclick=fn;
for(let [id,w,h] of [['size360',360,800],['size390',390,844],['size412',412,915]])on(id,()=>{frame.style.width=w+'px';frame.style.height=h+'px';});
on('first',()=>{bot=false;qa().reset(1);mode='首屏';});on('play',()=>{qa().reset(1);qa().start();bot=true;miss=true;mode='连续正常策略，首个石头故意失误，然后走奖励高路'});on('manual',()=>{bot=false;mode='人工操作';});on('pause',()=>qa().pause());on('resume',()=>qa().resume());on('restart10',()=>{bot=false;for(let i=0;i<10;i++){qa().reset(i+1);qa().start();}qa().reset(1);notes.push('10次重开完成，未添加事件监听器');});
function locate(kind){bot=false;qa().reset(1);qa().start();let g=qa().game;let ids={valley:'shelf',forest:'forest',cloud:'cloud',ridge:'double',mount:'fox',boost:'corridor',avalanche:'snowball'},s=kind==='ending'?g.level.segments.at(-1):g.level.segments.find(s=>s.id===ids[kind])||g.level.segments[0];g.p.x=s.start+700;g.p.y=ground(g.level,g.p.x);g.time=150;g.p.lead=900;if(kind==='mount')takeMount(g,'fox');if(kind==='boost')boost(g,2.05,4);if(kind==='cloud'){g.p.wing=6;g.p.wingVisual=1;g.p.y-=240;g.p.grounded=false;g.p.vy=20;qa().input('jump',true);}if(kind==='avalanche'){g.p.lead=25;g.p.caught=.2;}if(kind==='ending'){g.p.x=g.level.finish-50;g.p.y=ground(g.level,g.p.x);}mode='开发定位：'+kind;}
for(let k of ['valley','forest','cloud','ridge','mount','boost','avalanche','ending'])on(k,()=>locate(k));
on('low',()=>{qa().input('jump',true);setTimeout(()=>qa().input('jump',false),90);});on('high',()=>{qa().input('jump',true);setTimeout(()=>qa().input('jump',false),280);});on('flip',()=>{qa().input('trick',true);setTimeout(()=>qa().input('trick',false),400);});
on('pointer',()=>{const q=qa(),d=frame.contentDocument;let j=d.getElementById('jump'),t=d.getElementById('trick');q.reset(1);q.start();for(let [el,id,type] of [[j,71,'pointerdown'],[t,72,'pointerdown'],[j,71,'pointercancel'],[t,72,'pointerup']])el.dispatchEvent(new PointerEvent(type,{pointerId:id,pointerType:'touch',bubbles:true,cancelable:true}));notes.push('浏览器合成事件：双指down → jump cancel → trick up；剩余指针 '+q.activePointers+'，输入 '+JSON.stringify(q.game.input));});
function loop(){const q=qa();if(q){let g=q.game;if(bot&&q.mode==='paused')q.resume();if(bot&&g.state==='playing'){if(g.time<4&&miss){}else{miss=false;planInput(g,{routes:true,tricks:true});}}let a=q.frames.slice(-3600).filter(v=>v>0).sort((a,b)=>a-b);log.textContent=JSON.stringify({version:q.version,mode,state:g.state,time:+g.time.toFixed(2),x:Math.round(g.p.x),collisions:g.p.collisions,flips:g.p.flips,rewards:g.rewards.size,mount:g.p.mount?.kind,seed:g.level.seed,reason:g.reason,frames:a.length,p50:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)],dropped:q.dropped,userAgent:navigator.userAgent,dpr:devicePixelRatio,pointers:q.activePointers,audioNodes:q.audioNodes,objectCounts:{items:g.level.items.length,obstacles:g.level.obstacles.length,platforms:g.level.platforms.length,taken:g.taken.size,events:g.events.length,trace:g.trace.length,buttons:frame.contentDocument.querySelectorAll('button').length},trace:g.trace.slice(-5),notes},null,2);}requestAnimationFrame(loop);}loop();
</script></html>
