</svg><div class="controls" role="group" aria-label="动画控制"><button id="play-toggle" type="button" aria-pressed="false">暂停</button><label for="speed">速度</label><select id="speed" aria-label="播放速度"><option value="1" selected>1×</option><option value="3">3×</option><option value="5">5×</option></select></div><script>"use strict";
const get=id=>document.getElementById(id);
const tau=Math.PI*2;
function leg(side,angle,hx,hy){
 const x=570+64*Math.cos(angle),y=612+64*Math.sin(angle);
 // Two-segment inverse kinematics keeps each foot on its pedal.
 const dx=x-hx,dy=y-10-hy,d=Math.hypot(dx,dy),upper=140,lower=155;
 const a=(upper*upper-lower*lower+d*d)/(2*d);
 const h=Math.sqrt(Math.max(0,upper*upper-a*a));
 const kx=hx+a*dx/d-h*dy/d,ky=hy+a*dy/d+h*dx/d;
 const bone=`M${hx} ${hy} L${kx} ${ky} L${x} ${y-10}`;
 get(side+'-bone').setAttribute('d',bone);
 if(side==='near')get('near-outline').setAttribute('d',bone);
 get(side+'-crank').setAttribute('d',`M570 612 L${x} ${y}`);
 get(side+'-pedal').setAttribute('d',`M${x-24} ${y+2} H${x+26}`);
 get(side+'-foot').setAttribute('d',`M${x-8} ${y-15} Q${x+2} ${y-17} ${x+11} ${y-8} L${x+25} ${y-3} Q${x+32} ${y+2} ${x+23} ${y+2} H${x-16} Q${x-22} ${y} ${x-17} ${y-7}Z`);
}
function draw(ms){
 const angle=ms/1000*tau/2.4;
 leg('far',angle+Math.PI,530,402);
 leg('near',angle,516,400);
 const degrees=angle*180/Math.PI*2.4;
 const seconds=ms/1000;
 for(const [id,rate] of [['cloud-scroll',14],['mountain-scroll',32],['water-scroll',75]]){
  get(id).setAttribute('transform',`translate(${-((seconds*rate)%1200)} 0)`);
 }
 const travel=seconds*164*tau;
 get('fence-scroll').setAttribute('transform',`translate(${-(travel%130)} 0)`);
 get('road-stripes').setAttribute('stroke-dashoffset',String(travel%120));
 for(const cx of [330,860])get('spokes-'+cx).setAttribute('transform',`rotate(${degrees} ${cx} 612)`);
}
let elapsed=0,last=null,paused=false,speed=1;
function advance(now){
 if(last!==null&&!paused&&!document.hidden)elapsed+=Math.max(0,now-last)*speed;
 last=now;
}
function frame(now){advance(now);draw(elapsed);requestAnimationFrame(frame);}
get('play-toggle').addEventListener('click',()=>{
 advance(performance.now());paused=!paused;
 get('play-toggle').textContent=paused?'继续':'暂停';
 get('play-toggle').setAttribute('aria-pressed',String(paused));
});
get('speed').addEventListener('change',()=>{
 advance(performance.now());speed=Number(get('speed').value);
});
document.addEventListener('visibilitychange',()=>{last=null;});
draw(0);requestAnimationFrame(frame);
</script></body></html>
