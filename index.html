<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf3eb"><meta name="description" content="在雪境小站散步，写一张给自己的明信片，或和鹈鹕出发去灯塔。"><title>鹈鹕雪境 · 来坐一会儿</title><link rel="stylesheet" href="./station/style.css?v=20261031-s1"></head>
<body><div id="station">
<header class="topbar"><a class="brand" href="./" aria-label="鹈鹕雪境首页"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 32Q4 15 19 12L26 18L42 21L28 27L25 37L11 37Z" fill="#fff9e9" stroke="currentColor" stroke-width="2.3"/><path d="M27 19L43 22L28 26Z" fill="#e8b267" stroke="currentColor" stroke-width="2"/><circle cx="23" cy="18" r="1.5"/><path d="M10 33L25 34" stroke="#c77763" stroke-width="4"/></svg><span>鹈鹕雪境<small>A LITTLE PLACE TO WANDER</small></span></a><div class="top-actions"><button id="phase" class="icon-button" aria-label="切换小站时光">☀<span>晨光</span></button><button id="sound" class="icon-button" aria-pressed="false">♪<span>风铃关</span></button></div></header>
<main><section class="welcome"><p class="eyebrow" id="dateLabel">雪谷 · 第一站</p><h1>来，坐一会儿。</h1><p>没有急事。可以散步，也可以去一趟远方。</p></section>
<section class="world" id="world" aria-label="可探索的雪境小站"><canvas id="scene" aria-label="雪山、木屋、邮局和一条通往远方的路。轻点空地，鹈鹕会走过去。"></canvas><div id="hotspots"><button class="place" id="cabin" data-x="235" data-y="620"><span class="place-icon">⌂</span>旅人小屋<small>打开旅行箱</small></button><button class="place" id="post" data-x="735" data-y="720"><span class="place-icon">✉</span>山间邮局<small>写一张明信片</small></button><button class="place trail" id="trail" data-x="755" data-y="390"><span class="place-icon">↗</span>出发去灯塔<small>约三分钟的雪路</small></button><div id="objects"></div></div><div class="scene-weather" id="weather">小站里正落着细雪</div></section>
<section class="bottom-tray" aria-label="小站活动"><button class="walk-card" id="walk"><span class="round-icon">❧</span><span><b>今天的小小发现</b><small id="walkProgress">雪里藏着三件小物，找找看。</small></span><span id="walkCount">0 / 3</span></button><button class="letter-card" id="letter"><span class="round-icon">✧</span><span><b>读一封山里的短笺</b><small>来自这个小世界的一段故事</small></span><span>↗</span></button></section>
<footer><span>樱吹雪的雪境 · 第一站</span><button id="about">关于这座小站</button></footer></main>
</div>
<dialog id="sheet" aria-labelledby="sheetTitle"><header class="sheet-head"><div><p class="eyebrow" id="sheetEyebrow">SNOWBOUND STATION</p><h2 id="sheetTitle">旅行箱</h2></div><button id="closeSheet" class="close-button" aria-label="关闭面板">×</button></header><div id="sheetBody"></div></dialog>
<section id="journeyShell" hidden role="dialog" aria-modal="true" aria-label="灯塔之旅"><header class="journey-bar"><button id="backStation">← 回小站</button><span>灯塔之旅</span><span>PELICAN</span></header><iframe id="journeyFrame" title="鹈鹕逐雪 · 灯塔之旅" allow="autoplay" src="about:blank"></iframe></section>
<div id="notice" role="status" aria-live="polite"></div><input id="restoreFile" type="file" accept="application/json,.json" hidden>
<noscript><p class="noscript">打开 JavaScript 后，就能在小站散步。<a href="./play.html">也可以进入灯塔之旅</a>。</p></noscript>
