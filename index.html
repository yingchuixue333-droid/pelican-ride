 if(view.boost>0){ctx.save();ctx.globalAlpha=.42;for(let i=0;i<6;i++){const yy=H*(i<3?.18:.78)+(i%3)*H*.035,xx=W-((clock*1350+i*173)%W);path(c=>{c.moveTo(xx,yy);c.lineTo(xx+70,yy);},null,'#fff',2);}for(let i=0;i<14;i++)circle(anchor-65-i*8,by-4-Math.abs(Math.sin(clock*10+i))*15,2+i%3,'#fff');ctx.restore();}
 if(view.burst>0){ctx.save();ctx.globalAlpha=view.burst/.45;for(let i=0;i<12;i++)circle(anchor-55-(.45-view.burst)*(110+i*30),by-10-Math.sin(i)*(.45-view.burst)*90,3+i%3,'#eafaff');ctx.restore();}
 if(view.grounded)for(let i=0;i<7;i++)circle(anchor-45-i*7,by-2-Math.abs(Math.sin(clock*7+i))*8,2+(i%2),'#fff');
 const danger=clamp((550-view.lead)/550,0,1);if(danger>0){const fog=ctx.createLinearGradient(0,0,W*.14,0);fog.addColorStop(0,'rgba(177,208,226,'+(danger*.5)+')');fog.addColorStop(1,'rgba(177,208,226,0)');ctx.fillStyle=fog;ctx.fillRect(0,0,W*.14,H);}
 const front=Math.min(anchor+25,anchor-view.lead),frontY=ground(view.x-Math.max(-25,view.lead))-camY;
const cloud=ctx.createLinearGradient(front-180,0,front+20,0);cloud.addColorStop(0,'#7695afa8');cloud.addColorStop(1,'#e7f6ff');
path(c=>{c.moveTo(-30,H+20);c.lineTo(-30,frontY-170);c.bezierCurveTo(front-190,frontY-200,front-65,frontY-190,front,frontY-35);c.lineTo(front+12,frontY+45);c.lineTo(front-40,H+20);c.closePath();},cloud);
for(let i=0;i<18;i++){const wx=view.x-Math.max(-25,view.lead)-i*22,xx=wx-camX,yy=ground(wx)-camY;circle(xx,yy-30-Math.sin(clock*3+i)*18,35+(i%4)*8,i%2?'#e9f6fd':'#c2d9e8');}
for(let i=0;i<22;i++)circle(front-80+(i*41+clock*170)%100,frontY-20-((i*29+clock*100)%160),2+i%4,'#ffffffbb');
for(const f of fragments){ctx.save();ctx.globalAlpha=Math.max(0,f.life/.65);ctx.translate(f.x-camX,f.y-camY);ctx.rotate(f.angle);ctx.fillStyle='#7894a5';ctx.fillRect(-f.size/2,-f.size/2,f.size,f.size);ctx.restore();}
if(view.windReturn){ctx.fillStyle='#315c78';ctx.font='18px system-ui';ctx.fillText('↓ 雪坡在下方 · 未接住云也可安全回落',W*.14,H*.86);}
const rect=canvas.getBoundingClientRect();el('ski-feedback').style.left=(anchor/W*rect.width)+'px';el('ski-feedback').style.top=clamp((by-170)/H*rect.height,rect.height*.27,rect.height*.74)+'px';
 for(let i=0;i<22;i++){const sx=((i*151-clock*18)%W+W)%W,sy=(i*79+clock*22)%H;circle(sx,sy,1.5,'#ffffff99');}
}
const fixedDt=1/120;
function advanceGame(dt){accumulator+=Math.min(dt,.1);while(accumulator+1e-10>=fixedDt){previous={x:player.x,y:player.y,angle:player.angle};step(fixedDt);accumulator-=fixedDt;}return clamp(accumulator/fixedDt,0,1);}
function frame(now){if(document.body.dataset.mode==='ski'){const dt=lastFrame===null?0:(now-lastFrame)/1000;lastFrame=now;if(!document.hidden){if(dt>.25)accumulator=0;const alpha=state==='playing'?advanceGame(dt):1;render(alpha);sound.tick();}}else{lastFrame=null;accumulator=0;}requestAnimationFrame(frame);}
let activePointer=null;
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||activePointer!==null)return;activePointer=e.pointerId;e.preventDefault();canvas.setPointerCapture(e.pointerId);press();});function releasePointer(e){if(e.pointerId!==activePointer)return;activePointer=null;release();}canvas.addEventListener('pointerup',releasePointer);canvas.addEventListener('pointercancel',e=>{releasePointer(e);pause();});canvas.addEventListener('lostpointercapture',e=>{if(activePointer===e.pointerId){releasePointer(e);pause();}});
window.addEventListener('keydown',e=>{if(document.body.dataset.mode!=='ski'||e.target!==canvas)return;if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat){e.preventDefault();press();}if(e.code==='Escape')pause();});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release();});
el('ski-emergency').addEventListener('click',emergency);
const playArea=el('ski-app');playArea.addEventListener('selectstart',e=>e.preventDefault());playArea.addEventListener('contextmenu',e=>e.preventDefault());for(const type of ['touchstart','touchmove'])canvas.addEventListener(type,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
el('ski-music').addEventListener('click',()=>sound.toggle('music'));el('ski-fx').addEventListener('click',()=>sound.toggle('fx'));
el('ski-start').addEventListener('click',()=>state==='paused'?resume():start());el('ski-restart').addEventListener('click',start);el('ski-pause').addEventListener('click',pause);
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{lastFrame=null;if(document.hidden)pause();});window.addEventListener('blur',()=>{if(document.body.dataset.mode==='ski')pause();});
sound.sync();reset();resize();render();requestAnimationFrame(frame);
})();
</script></body></html>
