<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V4 持续挑战 · 实际玩法验收</title><style>body{margin:0;background:#e5eeec;font:14px system-ui;display:flex;gap:18px}iframe{border:0;width:390px;height:844px;flex-shrink:0}aside{padding:14px;max-width:560px}button{min-height:42px;margin:3px;padding:5px 10px}pre{white-space:pre-wrap;font:12px monospace}h2{font-size:20px}</style><iframe id="game" title="实际游戏" src="./index.html?audit=1&build=20261003-v4d"></iframe><aside><h2>正式玩法同源验收</h2><p>策略仅发送单指按下/松开；无定位、无状态注入。</p><button id="s360">360×800</button><button id="s390">390×844</button><button id="s430">430×932</button><button id="normal">不做技巧的低路策略</button><button id="high">地形决策策略</button><button id="recovery">三次轻碰后正常策略</button><button id="stop">停止策略</button><button id="tap20">20ms轻点</button><button id="tap40">40ms轻点</button><button id="tap80">80ms轻点</button><button id="tap150">150ms轻点</button><button id="pointer">双指取消检查</button><button id="restart">十次重开</button><button id="pause">暂停</button><button id="resume">恢复</button><pre id="log">等待加载</pre></aside><script type="module">
import {planInput} from './journey/validation.js?v=20261003-v4d';
const frame=document.getElementById('game'),log=document.getElementById('log');let bot=null,notes=[],lastTap=0;const q=()=>frame.contentWindow.snowAudit,on=(id,fn)=>document.getElementById(id).onclick=fn;
for(let[w,h]of[[360,800],[390,844],[430,932]])on('s'+w,()=>{frame.style.width=w+'px';frame.style.height=h+'px';});
for(let k of ['normal','high','recovery'])on(k,()=>{q().reset(1);q().start();bot=k;notes=[];});on('stop',()=>{bot=null;q().input('jump',false);});on('pause',()=>q().pause());on('resume',()=>q().resume());
for(let ms of [20,40,80,150])on('tap'+ms,()=>{let a=q();a.reset(1);a.start();bot=null;let c=frame.contentDocument.getElementById('canvas');c.dispatchEvent(new PointerEvent('pointerdown',{pointerId:91,isPrimary:true,bubbles:true,clientX:200,clientY:440}));setTimeout(()=>c.dispatchEvent(new PointerEvent('pointerup',{pointerId:91,isPrimary:true,bubbles:true})),ms);notes.push('真实页面事件20/40/80/150ms测试（浏览器合成pointer事件） '+ms);});
on('pointer',()=>{let a=q();bot=null;a.reset(1);a.start();let c=frame.contentDocument.getElementById('canvas');for(let id of [71,72])c.dispatchEvent(new PointerEvent('pointerdown',{pointerId:id,isPrimary:id===71,bubbles:true}));c.dispatchEvent(new PointerEvent('pointercancel',{pointerId:71,bubbles:true}));c.dispatchEvent(new PointerEvent('pointerup',{pointerId:72,bubbles:true}));notes.push('双指down → 主指cancel → 次指up');});on('restart',()=>{bot=null;for(let i=0;i<10;i++){q().reset(1);q().start();q().pause();}notes.push('10次重开完成');});
function loop(){let a=q();if(a){let g=a.game;if(bot&&g.state==='paused')a.resume();if(bot&&g.state==='playing'){let skip=bot==='recovery'&&g.p.collisions<3&&g.time<60&&g.level.segments.find(s=>g.p.x>=s.start&&g.p.x<s.end)?.obstacles.some(o=>o.kind==='rock'&&!g.hit.has(o.id)&&o.x>g.p.x&&o.x-g.p.x<1000);if(skip){a.input('jump',false);}else planInput(g,{routes:bot==='high'||bot==='recovery',tricks:bot==='high'||bot==='recovery'});}let sorted=a.frames.slice(-2400).filter(x=>x>0).sort((a,b)=>a-b);log.textContent=JSON.stringify({version:a.version,startupMs:a.startupMs,sessionActive:a.session.active,bot,state:g.state,time:+g.time.toFixed(2),x:Math.round(g.p.x),chapter:g.level.segments.find(s=>g.p.x>=s.start&&g.p.x<s.end)?.theme,reason:g.reason,input:g.input,pointers:a.activePointers,jumps:g.stats.jumps,flaps:g.stats.flaps,grounded:g.p.grounded,rotation:+g.p.rotation.toFixed(3),feathers:g.p.rescue,fish:g.p.fish,collisions:g.p.collisions,hits:g.stats.hits,flips:g.p.flips,partners:g.stats.partners,mount:g.p.mount,wind:+g.p.wing.toFixed(2),rewards:g.rewards.size,parts:g.p.parts,recent:g.history.filter(e=>['land','relay','hit','recover','route'].includes(e.type)).slice(-12),score:g.p.score,lead:Math.round(g.p.lead),worldSpeed:+g.p.speed.toFixed(1),screenWidthRate:+(g.p.speed/(820*Math.min(1.12,1+(g.p.speed/530-1)*.16))).toFixed(3),p50:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)],dropped:a.dropped,objects:{items:g.level.items.length,segments:g.level.segments.length,events:g.events.length,buttons:frame.contentDocument.querySelectorAll('button').length},audioNodes:a.audioNodes,progress:a.progress,notes},null,2);}requestAnimationFrame(loop);}loop();
</script></html>
